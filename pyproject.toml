[project]
name = "bonsai-manager"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "click>=8.4.1",
    "fastmcp>=3.4.2",
    "pydantic>=2.13.4",
    "pyrefly>=1.1.1",
    "python-dotenv>=1.2.2",
    "requests>=2.34.2",
    "rich>=15.0.0",
    "sentence-transformers>=5.6.0",
    "sqlalchemy>=2.0.51",
    "tabulate>=0.10.0",
    "textual>=8.2.7",
    "textual-serve>=1.1.3",
]

[tool.pyrefly]
preset = "strict"
project-includes = [
    "**/*.py*",
    "**/*.ipynb",
]

[dependency-groups]
dev = [
    "types-requests>=2.33.0.20260518",
]
