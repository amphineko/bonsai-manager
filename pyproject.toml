[project]
name = "bonsai-manager"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "click>=8.4.2",
    "fastmcp>=3.4.4",
    "lancedb>=0.34.0",
    "pydantic>=2.13.4",
    "pyrefly>=1.1.1",
    "python-dotenv>=1.2.2",
    "requests>=2.34.2",
    "rich>=15.0.0",
    "sentence-transformers>=5.6.1",
    "sqlalchemy>=2.0.51",
    "tabulate>=0.10.0",
    "textual>=8.2.8",
    "textual-serve>=1.1.3",
    "tqdm>=4.69.1",
]

[tool.pyrefly]
preset = "strict"
project-includes = ["**/*.py*", "**/*.ipynb"]
min-severity = "warn"

[dependency-groups]
dev = [
    "ruff>=0.16.0",
    "types-requests>=2.33.0.20260712",
    "types-tqdm>=4.70.0.20260730",
]

[tool.ruff.lint]
extend-select = [
    "B",
    "C4",
    "E",
    "F",
    "FA",
    "FURB",
    "I",
    "ISC",
    "PTH",
    "RET",
    "SIM",
    "TC",
    "TID",
    "W",
]
ignore = ["TC001"]
fixable = ["ALL"]
unfixable = []

[tool.ruff.format]
docstring-code-format = true
