name: E2E Tests

on:
  push:
    branches:
      - master
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  unit-tests:
    runs-on: ubuntu-latest
    steps:
      - name: Check out code
        uses: actions/checkout@v7

      - name: Set up uv
        uses: astral-sh/setup-uv@ae62891fec2bb8e7d6c99fc78c9fec3a63790f8d

      - name: Install dependencies
        run: uv sync --frozen

      - name: Run unit tests
        run: uv run python -m unittest discover -s src/tests -t src

  mcp-e2e:
    runs-on: ubuntu-latest
    steps:
      - name: Check out code
        uses: actions/checkout@v7

      - name: Set up uv
        uses: astral-sh/setup-uv@ae62891fec2bb8e7d6c99fc78c9fec3a63790f8d

      - name: Install dependencies
        run: uv sync --frozen

      - name: Cache Hugging Face models
        uses: actions/cache@v6
        with:
          path: ~/.cache/huggingface
          key: ${{ runner.os }}-huggingface-qwen3-embedding-0.6b-v1

      - name: Ensure embedding model is available
        run: uv run hf download Qwen/Qwen3-Embedding-0.6B

      - name: Run MCP E2E tests
        run: uv run python src/main.py scripts mcp-e2e

  search-e2e:
    runs-on: ubuntu-latest
    steps:
      - name: Check out code
        uses: actions/checkout@v7

      - name: Set up uv
        uses: astral-sh/setup-uv@ae62891fec2bb8e7d6c99fc78c9fec3a63790f8d

      - name: Install dependencies
        run: uv sync --frozen

      - name: Cache Hugging Face models
        uses: actions/cache@v6
        with:
          path: ~/.cache/huggingface
          key: ${{ runner.os }}-huggingface-qwen3-embedding-0.6b-v1

      - name: Run search E2E tests
        run: >
          uv run python src/main.py scripts search-e2e
          --no-mock-embedding --allow-download
