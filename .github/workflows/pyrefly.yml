name: Pyrefly Type Check

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  typecheck:
    runs-on: ubuntu-latest
    steps:
      - name: Check out code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: astral-sh/setup-uv@v9

      - name: Install dependencies
        run: uv sync --frozen

      - name: Run Pyrefly Type Checker
        run: uv run pyrefly check --output-format=github
